version: 2
updates:
  # The app has no external Swift package dependencies. GitHub Actions are the
  # supply-chain surface, so keep them updated from the pinned commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
