name: Nightly

# Slow, destructive and compatibility checks live here, not in the PR gate.
# The ephemeral runner makes the destructive tests safe: they only create and
# remove simulator/cache/leftover fixtures with a Nightly prefix.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Full suite and destructive integration
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Unit tests and real actions
        env:
          SIFTBAR_NIGHTLY: "1"
        run: |
          set +e
          ./scripts/test.sh 2>&1 | tee nightly-tests.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            {
              echo "### Nightly unit/integration failure"
              echo '```'
              grep -E "✗|error:|failed \\(" nightly-tests.log | tail -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload nightly test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nightly-tests-log
          path: nightly-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install and upgrade shape
        run: ./scripts/nightly-install-check.sh v0.6.0

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: UI suite
        run: |
          xcodegen generate
          xcodebuild test \
            -project SiftBar.xcodeproj \
            -scheme SiftBar \
            -destination 'platform=macOS' \
            -resultBundlePath build/UI.xcresult

      - name: Upload UI results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nightly-UI-xcresult
          path: build/UI.xcresult
          if-no-files-found: ignore
          retention-days: 7

  intel:
    # Experimental until the macos-15-intel label is part of the supported
    # matrix. Kept non-blocking so an image change cannot fail the whole run.
    name: Intel compatibility (non-blocking)
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          uname -m

      - name: Build universal release
        run: ARCHS="arm64 x86_64" ./scripts/build.sh release

      - name: Unit tests
        run: ./scripts/test.sh

  mutation:
    # Manual only: mutation testing is slow and needs a full Xcode/SwiftPM
    # toolchain. Run it before a major release, not on every night.
    name: Mutation testing (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Muter
        run: brew install muter-mutation-testing/formulae/muter

      # Muter 16 currently produces an unparsable mutant in
      # ActionExecutor.batchTitle. Keep the mutation job on the two pure safety
      # files until upstream handles it; ActionExecutor still has dedicated
      # unit and injected-command tests.
      - name: Run Muter on safety-critical files
        run: |
          muter --skip-update-check \
            --files-to-mutate "Sources/SiftBar/Actions/CleanupWhitelist.swift,Sources/SiftBar/Actions/ProcessSafety.swift" \
            --output muter-report.txt

      - name: Fail on surviving mutants
        run: ./scripts/check-mutation-report.sh muter-report.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muter-report
          path: muter-report.txt
          if-no-files-found: ignore
          retention-days: 30
