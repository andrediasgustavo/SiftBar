name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app
        run: ./scripts/build.sh release

      - name: Package DMG
        run: ./scripts/package.sh

      - name: Verify app and DMG
        run: |
          test -x dist/SiftBar.app/Contents/MacOS/SiftBar
          plutil -lint dist/SiftBar.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/SiftBar.app
          test -f dist/SiftBar.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/SiftBar.app/Contents/Info.plist)" = "AppIcon"
          hdiutil verify dist/SiftBar.dmg

          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach dist/SiftBar.dmg -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          test -L "$MOUNT/Applications"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/SiftBar.app"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "SiftBar $GITHUB_REF_NAME" \
              --generate-notes

          gh release upload "$GITHUB_REF_NAME" dist/SiftBar.dmg --clobber

      - name: Document the first launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          if printf '%s' "$BODY" | grep -q "First launch on macOS"; then
            echo "First-launch note already present."
            exit 0
          fi
          NOTE="$(mktemp)"
          cat > "$NOTE" <<'EOF'
          ## First launch on macOS

          SiftBar is ad-hoc signed and not notarized yet, so macOS blocks the first launch. This is expected and only needs to be approved once.

          - **macOS 15+:** double-click SiftBar, click **Done**, then open **System Settings → Privacy & Security → Open Anyway**.
          - **macOS 13–14:** right-click SiftBar in Applications and choose **Open**.
          - Optional: grant **Full Disk Access** so protected folders appear in the scan.

          Full instructions: https://github.com/andrediasgustavo/SiftBar#install
          EOF
          { cat "$NOTE"; printf '\n---\n\n'; printf '%s\n' "$BODY"; } | gh release edit "$GITHUB_REF_NAME" --notes-file -
