name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app
        run: ./scripts/build.sh release

      - name: Package DMG
        run: ./scripts/package.sh

      - name: Verify app and DMG
        run: |
          test -x dist/SiftBar.app/Contents/MacOS/SiftBar
          plutil -lint dist/SiftBar.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/SiftBar.app
          hdiutil verify dist/SiftBar.dmg

          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach dist/SiftBar.dmg -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          test -L "$MOUNT/Applications"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/SiftBar.app"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "SiftBar $GITHUB_REF_NAME" \
              --generate-notes

          gh release upload "$GITHUB_REF_NAME" dist/SiftBar.dmg --clobber
