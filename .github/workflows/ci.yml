name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test --parallel

  validate:
    name: Scripts and app bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Validate Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Build app bundle
        run: ./scripts/build.sh release

      - name: Verify app bundle
        run: |
          test -x dist/SiftBar.app/Contents/MacOS/SiftBar
          plutil -lint dist/SiftBar.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/SiftBar.app/Contents/Info.plist)" = "true"
          codesign --verify --deep --strict --verbose=2 dist/SiftBar.app
          file dist/SiftBar.app/Contents/MacOS/SiftBar

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiftBar-${{ github.sha }}
          path: dist/SiftBar.app
          if-no-files-found: error
          retention-days: 7
