name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test --parallel

  validate:
    name: Scripts and app bundle
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Validate Info.plist
        run: plutil -lint Resources/Info.plist

      - name: Build app bundle
        run: ./scripts/build.sh release

      - name: Verify app bundle
        run: |
          test -x dist/SiftBar.app/Contents/MacOS/SiftBar
          plutil -lint dist/SiftBar.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/SiftBar.app/Contents/Info.plist)" = "true"
          codesign --verify --deep --strict --verbose=2 dist/SiftBar.app
          test -f dist/SiftBar.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/SiftBar.app/Contents/Info.plist)" = "AppIcon"
          file dist/SiftBar.app/Contents/MacOS/SiftBar

      - name: Package DMG
        run: ./scripts/package.sh

      - name: Verify DMG
        run: hdiutil verify dist/SiftBar.dmg

      - name: Verify app inside DMG
        run: |
          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach dist/SiftBar.dmg -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          test -L "$MOUNT/Applications"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/SiftBar.app"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiftBar-${{ github.sha }}
          path: |
            dist/SiftBar.app
            dist/SiftBar.dmg
          if-no-files-found: error
          retention-days: 7
